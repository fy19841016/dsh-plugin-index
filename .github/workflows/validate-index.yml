name: validate-index

on:
  push:
    paths:
      - 'index.json'
      - 'verify-index.mjs'
      - '.github/workflows/validate-index.yml'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate index.json
        run: node verify-index.mjs index.json
